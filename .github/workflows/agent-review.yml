name: agent-review
# Independent reviewers run as separate jobs with fresh context and report as commit statuses:
# agent/reviewer, agent/tester, agent/architect, agent/security.
# If a reviewer requests changes, the builder is re-triggered (max 3 rounds).
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, labeled]

permissions:
  contents: read
  pull-requests: write
  statuses: write
  issues: write
  id-token: write

jobs:
  review:
    if: vars.AGENTS_ENABLED == 'true' && !contains(github.event.pull_request.labels.*.name, 'agent:stop') && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        role: [reviewer, tester, architect, security]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: '${{ github.event.pull_request.head.sha }}' }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Mark pending
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \
            -f state=pending -f context=agent/${{ matrix.role }} -f description="reviewing"
        env: { GH_TOKEN: '${{ github.token }}' }
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: "--max-turns 40"
          prompt: |
            Act as the `${{ matrix.role }}` subagent defined in .claude/agents/${{ matrix.role }}.md.
            Review PR #${{ github.event.pull_request.number }} against CLAUDE.md and its linked issue.
            Diff base: origin/${{ github.base_ref }}. You did not write this code.
            Post ONE PR comment headed "### ${{ matrix.role }} review" with your findings.
            Then write a file verdict.json containing exactly
            {"verdict":"APPROVE"|"REQUEST_CHANGES","raise_tier_to":null|1|2,"summary":"<one line>"}.
      - name: Publish verdict as status
        if: always()
        run: |
          V=$(jq -r .verdict verdict.json 2>/dev/null || echo REQUEST_CHANGES)
          S=$(jq -r .summary verdict.json 2>/dev/null || echo "no verdict produced")
          R=$(jq -r '.raise_tier_to // empty' verdict.json 2>/dev/null || true)
          STATE=$([ "$V" = "APPROVE" ] && echo success || echo failure)
          gh api repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \
            -f state=$STATE -f context=agent/${{ matrix.role }} -f description="${S:0:130}"
          if [ -n "$R" ]; then
            gh pr edit ${{ github.event.pull_request.number }} --remove-label tier:0 --remove-label tier:1 --add-label tier:$R || true
          fi
        env: { GH_TOKEN: '${{ github.token }}' }

  fix-round:
    needs: review
    if: failure() && vars.AGENTS_ENABLED == 'true' && startsWith(github.head_ref, 'agent/')
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write, issues: write, id-token: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: '${{ github.head_ref }}' }
      - name: Count rounds
        id: rounds
        run: |
          N=$(gh pr view ${{ github.event.pull_request.number }} --json comments -q '[.comments[].body | select(startswith("### fix round"))] | length')
          echo "n=$N" >> $GITHUB_OUTPUT
          if [ "$N" -ge 3 ]; then gh pr edit ${{ github.event.pull_request.number }} --add-label needs-owner; fi
        env: { GH_TOKEN: '${{ github.token }}' }
      - uses: anthropics/claude-code-action@v1
        if: steps.rounds.outputs.n < 3
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: "--max-turns 60"
          prompt: |
            Act as the builder subagent (.claude/agents/builder.md) on PR #${{ github.event.pull_request.number }}.
            Read every "### <role> review" comment that requested changes and fix each item on this branch.
            Do not weaken tests. Push the commits, then post a comment starting "### fix round" listing what you changed.
